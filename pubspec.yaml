name: mar_weather
description: "MAR-Wether — Moroccan weather app (current + 7-day forecast for Moroccan cities, GPS, AR/FR/EN)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  geolocator: ^13.0.4
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  google_fonts: ^6.2.1
  go_router: ^15.1.3
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
